<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Approve payment - Atlas Treasury</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--blue); min-height: 100vh; }
    .phone { max-width: 480px; margin: 0 auto; padding: 18px 14px 40px; }
    .phone .brand { color: #fff; margin-bottom: 14px; }
    .sheet { background: #fff; border-radius: 22px; padding: 22px 20px; box-shadow: 0 20px 50px rgba(0,0,0,.25); display: grid; gap: 16px; }
    .who { display: flex; gap: 12px; align-items: center; }
    .big { font-size: 2.7rem; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
    .reasons-box { background: var(--red-50); border: 1px solid #f6c9c4; border-radius: 14px; padding: 12px 14px; color: var(--red); }
    .reasons-box ul { margin: 6px 0 0; padding-left: 18px; }
    .why { background: #f7f9fd; border-radius: 14px; padding: 12px 14px; }
    .why b { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .actions { display: grid; gap: 10px; }
    .actions button { font-size: 1.15rem; padding: 18px; border-radius: 16px; width: 100%; }
    .state { text-align: center; padding: 10px 0; }
    .state .tick { font-size: 3rem; }
  </style>
</head>
<body>
  <div class="phone">
    <div class="brand"><span class="brand-mark">A</span><span>Atlas Treasury</span><span class="sandbox">Sandbox</span></div>
    <div class="sheet" id="sheet"><div class="muted">Loading...</div></div>
  </div>
  <script type="module" src="/js/approve.js"></script>
</body>
</html>
